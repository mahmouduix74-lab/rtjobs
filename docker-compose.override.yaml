# Personal additions, kept out of docker-compose.yaml so upstream updates
# merge cleanly. Docker Compose loads this file automatically next to
# docker-compose.yaml (`docker compose up -d` picks up both).

services:
  scraper:
    build:
      # Chrome base built on THIS machine (scripts/setup_server.sh writes
      # CHROME_BASE=rtjobs-chrome-base:<version> to .env). Google only serves
      # the current Chrome, so a new server can't build the version the
      # Dockerfile pins; unset, the Dockerfile's pin is used.
      args:
        - CHROME_BASE

  sync:
    # Publishes new jobs (title, company, short excerpt, link) to the public
    # site's Turso database every minute. Reads the scraper's DB read-only.
    # See web/README.md.
    build:
      context: .
      dockerfile: web/Dockerfile
    image: rtjobs-web
    container_name: rtjobs-sync
    init: true
    command: ["python", "-m", "web.sync"]
    environment:
      - TZ=${TZ:-Africa/Cairo}
      - DATA_DIR=/data
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - PUBLIC_RETENTION_DAYS=${PUBLIC_RETENTION_DAYS:-45}
    volumes:
      - scraper_data:/data
    restart: unless-stopped
