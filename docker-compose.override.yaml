# Personal additions, kept out of docker-compose.yaml so upstream updates
# merge cleanly. Docker Compose loads this file automatically next to
# docker-compose.yaml (`docker compose up -d` picks up both).

services:
  web:
    # Personal web UI over the same SQLite DB (reads the scraper's tables only;
    # its own saved/applied/notes go to /data/web.db). See web/README.md.
    build:
      context: .
      dockerfile: web/Dockerfile
    image: rtjobs-web
    container_name: rtjobs-web
    init: true
    environment:
      - TZ=${TZ:-Africa/Cairo}
      - DATA_DIR=/data
      - WEB_TAXONOMY=/data/markup/enrichment/taxonomy.json
      - WEB_PASSWORD=${WEB_PASSWORD:-}
    volumes:
      - scraper_data:/data
      - ./markup:/data/markup:ro
    # Loopback only: reach it through Tailscale / an SSH tunnel / a reverse proxy.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    restart: unless-stopped
